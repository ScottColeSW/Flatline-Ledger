<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flatline Ledger: Black Hat vs White Hat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #15161a; --card: #1d1f26; --ink: #e8e8ec; --dim: #8a8d98;
    --black-hat: #e24b4b; --white-hat: #3fb27f; --line: #2a2d36;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  header .sub { color: var(--dim); font-size: 13px; }
  .scoreboard { margin-left: auto; font-size: 13px; color: var(--dim); }
  .controls { display: flex; gap: 8px; padding: 12px 20px; flex-wrap: wrap; }
  button {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: #444; }
  button.primary { background: var(--black-hat); border-color: var(--black-hat); color: white; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .strip {
    display: flex; gap: 6px; padding: 0 20px 12px; flex-wrap: wrap;
  }
  .strip button { font-size: 12px; padding: 6px 10px; }
  .strip button.active { border-color: var(--white-hat); color: var(--white-hat); }
  main { padding: 0 20px 40px; max-width: 1100px; margin: 0 auto; }
  .episode-title { font-size: 22px; margin: 10px 0 4px; }
  .episode-meta { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
  .pane {
    background: var(--card); border-radius: 10px; padding: 16px;
    border-top: 4px solid var(--line);
  }
  .pane.black { border-top-color: var(--black-hat); }
  .pane.white { border-top-color: var(--white-hat); }
  .pane h2 { font-size: 13px; letter-spacing: 1px; margin: 0 0 10px; text-transform: uppercase; }
  .pane.black h2 { color: var(--black-hat); }
  .pane.white h2 { color: var(--white-hat); }
  .line { font-size: 14px; line-height: 1.5; margin-bottom: 12px; color: var(--ink); }
  .fix-text { font-size: 13px; line-height: 1.5; color: var(--dim); white-space: pre-wrap; max-height: 140px; overflow-y: auto; }
  pre.result {
    background: #0f1014; border-radius: 6px; padding: 10px; font-family: var(--mono);
    font-size: 12px; overflow-x: auto; max-height: 220px; overflow-y: auto; margin: 0;
  }
  .status-pill {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .status-pill.VULNERABLE { background: rgba(226,75,75,0.18); color: var(--black-hat); }
  .status-pill.REMEDIATED { background: rgba(63,178,127,0.18); color: var(--white-hat); }
  .status-pill.ERROR { background: rgba(200,160,40,0.18); color: #c8a028; }
  .verdict {
    text-align: center; margin: 18px 0; font-size: 14px; color: var(--dim);
  }
  .verdict b { color: var(--white-hat); }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 30px 0; }
  a { color: var(--dim); }
  .loading { color: var(--dim); font-size: 13px; padding: 40px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>⚡ FLATLINE LEDGER</h1>
  <div class="sub">Black Hat vs White Hat — real exploits, real Juice Shop, real fixes</div>
  <div class="scoreboard" id="scoreboard">loading…</div>
</header>

<div class="controls">
  <button id="btnOpenShop" style="border-color: var(--white-hat); color: var(--white-hat);">⧉ OPEN JUICE SHOP</button>
  <button id="btnReplay">REPLAY</button>
  <button id="btnLive" class="primary">RUN LIVE</button>
  <button id="btnNext">NEXT →</button>
</div>

<div class="strip" id="strip"></div>

<main id="main"><div class="loading">Loading episodes…</div></main>

<footer>
  Every claim above comes from a saved predict/verify run in this repo's own <code>items/</code> directory.
  <a href="https://github.com/ScottColeSW/Flatline-Ledger" target="_blank">github.com/ScottColeSW/Flatline-Ledger</a>
</footer>

<script>
const API = "";
let EPISODES = [];
let CURRENT = 0;
let liveOverride = {}; // number -> {vulnerable, remediated} from a live run, overrides replay for the session

async function load() {
  const res = await fetch(`${API}/api/episodes`);
  const data = await res.json();
  EPISODES = data.episodes || [];
  renderScoreboard(data.battery);
  renderStrip();
  render();
}

function renderScoreboard(battery) {
  if (!battery) return;
  document.getElementById("scoreboard").textContent =
    `${battery.scored}/${battery.total} episodes scored · every one blocked by its real fix`;
}

function renderStrip() {
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  EPISODES.forEach((ep, i) => {
    const b = document.createElement("button");
    b.textContent = `${ep.number}. ${ep.title}`;
    b.className = i === CURRENT ? "active" : "";
    b.onclick = () => { CURRENT = i; render(); };
    strip.appendChild(b);
  });
}

function resultBlock(result) {
  if (!result) return `<div class="line" style="color:var(--dim)">No run recorded yet.</div>`;
  const status = result.status || "ERROR";
  const summary = result.summary || "";
  const copy = {...result};
  delete copy.summary;
  return `
    <span class="status-pill ${status}">${status}</span>
    <div class="line">${escapeHtml(summary)}</div>
    <pre class="result">${escapeHtml(JSON.stringify(copy, null, 2))}</pre>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  const ep = EPISODES[CURRENT];
  if (!ep) return;
  renderStrip();
  const live = liveOverride[ep.number];
  const vuln = live ? live.vulnerable : ep.vulnerable_result;
  const remediated = live ? live.remediated : ep.remediated_result;

  document.getElementById("main").innerHTML = `
    <div class="episode-title">Episode ${ep.number}: ${escapeHtml(ep.title)}</div>
    <div class="episode-meta">items/${ep.item} · ${ep.container === "main" ? "main container" : ep.container === "unsafe" ? "isolated -unsafe container" : "config pairing (safe vs unsafe.yml)"}${live ? " · showing a LIVE run from this session" : " · showing the most recently saved run"}${ep.no_scoreboard_popup ? " · <b style=\"color:#c8a028\">no \"solved\" popup will ever appear for this one (either not in Juice Shop's own catalog, or already solved by its own seed data on boot)</b>" : " · open Juice Shop and watch for the real \"solved\" popup when this runs live (needs a container that hasn't already solved it)"}</div>
    <div class="panes">
      <div class="pane black">
        <h2>Black Hat</h2>
        <div class="line">${escapeHtml(ep.black)}</div>
        ${resultBlock(vuln)}
      </div>
      <div class="pane white">
        <h2>White Hat</h2>
        <div class="line">${escapeHtml(ep.white)}</div>
        <div class="fix-text">${escapeHtml(ep.fix_narration || "")}</div>
        ${resultBlock(remediated)}
      </div>
    </div>
    <div class="verdict">
      ${remediated && remediated.status === "REMEDIATED"
        ? `<b>White Hat holds.</b> The real fix stopped the real exploit.`
        : `Fix not yet confirmed in this view.`}
    </div>
  `;
}

document.getElementById("btnReplay").onclick = () => {
  const ep = EPISODES[CURRENT];
  delete liveOverride[ep.number];
  render();
};

document.getElementById("btnLive").onclick = async () => {
  const ep = EPISODES[CURRENT];
  const btn = document.getElementById("btnLive");
  btn.disabled = true;
  btn.textContent = "RUNNING…";
  document.getElementById("main").insertAdjacentHTML("afterbegin",
    `<div class="loading" id="liveLoading">Running the real exploit, then the real fix, against the real container…</div>`);
  try {
    const res = await fetch(`${API}/api/episodes/${ep.number}/live`, { method: "POST" });
    const data = await res.json();
    if (data.error) {
      alert("Live run failed: " + data.error);
    } else {
      liveOverride[ep.number] = data;
    }
  } catch (e) {
    alert("Live run failed: " + e.message);
  }
  btn.disabled = false;
  btn.textContent = "RUN LIVE";
  render();
};

document.getElementById("btnNext").onclick = () => {
  CURRENT = (CURRENT + 1) % EPISODES.length;
  render();
};

// Juice Shop sends X-Frame-Options: SAMEORIGIN, so it can't be embedded in
// an iframe from this player's own origin. A real second window works
// instead, no framing restriction, and it's the real app, so Juice Shop's
// own "challenge solved" toast (broadcast globally over Socket.IO to every
// connected browser, not scoped to whichever account triggered it) appears
// there live the instant a RUN LIVE click actually solves that episode's
// challenge in the catalog.
let shopWindow = null;
document.getElementById("btnOpenShop").onclick = () => {
  const ep = EPISODES[CURRENT];
  const base = ep && ep.container !== "main" ? "http://localhost:3012" : "http://localhost:3001";
  shopWindow = window.open(`${base}/#/`, "flatline_juice_shop");
  if (shopWindow) shopWindow.focus();
};

load();
</script>
</body>
</html>
